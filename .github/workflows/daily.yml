name: daily-scan

on:
  schedule:
    - cron: "17 11 * * *"  # 11:17 UTC, about 3 or 4 in the morning in California
  workflow_dispatch:
    inputs:
      limit:
        description: "Only scan the first N servers (empty means all)"
        required: false
  push:
    branches: [main]
    paths: [".github/workflows/daily.yml"]

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[ml]"

      # The full output, with every tool, is too big for a git branch, so it lives in the
      # Actions cache for the next run. The data branch only carries the public files.
      - name: Restore the previous full output from the cache
        uses: actions/cache/restore@v4
        with:
          path: out
          key: snapshot-${{ github.run_id }}
          restore-keys: snapshot-

      - name: Use it as the previous snapshot, or fall back to the data branch
        run: |
          if [ -d out ]; then
            mv out previous
          elif git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            mkdir previous
            git archive origin/data | tar -x -C previous
          fi

      - name: Run the pipeline
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          LIMIT_ARG=""
          if [ -n "$LIMIT" ]; then
            [[ "$LIMIT" =~ ^[0-9]+$ ]] || { echo "limit must be a number"; exit 1; }
            LIMIT_ARG="--limit $LIMIT"
          fi
          PREV_ARG=""
          if [ -d previous ]; then PREV_ARG="--previous previous"; fi
          mcp-sentinel pipeline $PREV_ARG --out out --model models/sentinel-lr-1.pkl --workers 16 --budget-minutes 220 $LIMIT_ARG
          cat out/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Save the full output for the next run
        uses: actions/cache/save@v4
        with:
          path: out
          key: snapshot-${{ github.run_id }}

      - name: Keep the run output as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: out
          retention-days: 3
          if-no-files-found: ignore

      - name: Publish the public files to the data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir public
          cp out/servers.jsonl.gz out/flagged.jsonl.gz out/state.json out/summary.json out/history.jsonl public/
          cd public
          big=$(find . -type f -size +95M)
          if [ -n "$big" ]; then echo "files too large for GitHub: $big"; ls -la; exit 1; fi
          git init -q -b data
          git config user.name "Rohit Durbha"
          git config user.email "rohitdurbha@gmail.com"
          git add -A
          git commit -q -m "Data snapshot $(jq -r .generated_at summary.json)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
