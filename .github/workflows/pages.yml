name: pages

on:
  workflow_run:
    workflows: [daily-scan]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**", "src/mcp_sentinel/sitedata.py", "datasets/disputes.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Fetch the public data
        run: |
          git fetch --depth 1 origin data
          mkdir public
          git archive origin/data | tar -x -C public

      - name: Build the site
        run: mcp-sentinel site --data public --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
