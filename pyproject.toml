[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-sentinel"
version = "0.1.0"
description = "Crawls public MCP servers and scores their tools for poisoning risk."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rohit Durbha" }]
dependencies = [
  "httpx>=0.27",                 # registry API client
  "tree-sitter>=0.23",           # safe parsing of untrusted source code
  "tree-sitter-typescript>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-go>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mcp-sentinel = "mcp_sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures", ".cache", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
